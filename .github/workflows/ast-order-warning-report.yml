name: AST Order Warning Report

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ast-order-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: AST order (${{ matrix.revision }})
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["base", "head"]' || '["head"]') }}
    env:
      SCAN_SHA: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.sha }}
    steps:
      # Both scans use exactly the same checker, including when the PR changes it.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: |
            scripts/clang-tidy
            .github/workflows
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        with:
          # Compare the merge result with its base, so a PR behind master does
          # not appear to undo warning fixes that are already upstream.
          ref: ${{ env.SCAN_SHA }}
          path: source
          persist-credentials: false

      - name: Identify the scan cache
        id: scan-key
        env:
          CHECKER_HASH: ${{ hashFiles('tooling/scripts/clang-tidy/**', 'tooling/.github/workflows/ast-order-warning-report.yml') }}
        run: |
          echo "key=ast-order-v1-$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:?}-llvm21.1.8-$CHECKER_HASH-$SCAN_SHA" >> "$GITHUB_OUTPUT"

      # Only successful jobs save a cache. Default-branch runs populate the
      # baseline cache available to PRs; PR caches remain scoped to that PR.
      - name: Restore a completed scan
        id: scan-cache
        uses: actions/cache@v5
        with:
          path: ast-order-report
          key: ${{ steps.scan-key.outputs.key }}

      - name: Install LLVM 21.1.8
        if: steps.scan-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm.asc
          sudo install -m 644 /tmp/llvm.asc /usr/share/keyrings/llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tidy-21 llvm-21-dev libclang-21-dev ninja-build
          test "$(llvm-config-21 --version)" = '21.1.8'

      - name: Build and test the warning-only checker
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S tooling/scripts/clang-tidy -B build-tidy \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DLLVM_DIR=/usr/lib/llvm-21/lib/cmake/llvm \
            -DCLANG_TIDY=/usr/bin/clang-tidy-21
          cmake --build build-tidy --parallel "$(nproc)"
          ctest --test-dir build-tidy --output-on-failure
          python3 -m unittest discover -s tooling/scripts/clang-tidy/tests -p 'test_*.py'
          node --test tooling/scripts/clang-tidy/tests/comment.test.js

      - name: Generate sources and the compilation database
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          cmake -G Ninja -S source -B build \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_ADD_CUSTOM_COMMAND_DEPENDS_EXPLICIT_ONLY=ON
          # These Python generators declare all their inputs. Avoid CMake's
          # implicit component dependencies: clang-tidy needs no Z3 objects.
          cmake --build build --parallel 2 --target \
            src/api/api_log_macros.h src/ast/pattern/database.h

      - name: Report AST argument-order warnings
        if: steps.scan-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf ast-order-report
          python3 tooling/scripts/clang-tidy/run.py \
            --clang-tidy clang-tidy-21 --plugin build-tidy/Z3TidyModule.so \
            --build build --source-root source --output ast-order-report --jobs "$(nproc)"

      - name: Validate and print the warning count
        run: |
          python3 tooling/scripts/clang-tidy/compare.py \
            --head ast-order-report/summary.json --head-sha "$SCAN_SHA" --output scan-count
          cat ast-order-report/warnings.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ast-order-${{ matrix.revision }}-${{ github.run_attempt }}
          path: ast-order-report
          if-no-files-found: warn
          retention-days: 14

  compare:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-source
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.1
        with:
          name: ast-order-head-${{ github.run_attempt }}
          path: reports/head

      - uses: actions/download-artifact@v8.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ast-order-base-${{ github.run_attempt }}
          path: reports/base

      - name: Compare counts and write the job summary
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          base_args=()
          if [[ -n "$BASE_SHA" ]]; then
            base_args=(--base reports/base/summary.json --base-sha "$BASE_SHA"
                       --base-source base-source --head-source .)
          fi
          python3 scripts/clang-tidy/compare.py "${base_args[@]}" \
            --head reports/head/summary.json --head-sha "$HEAD_SHA" \
            --tested-sha "$TESTED_SHA" --output comparison
          node scripts/clang-tidy/comment.js comparison/comparison.json > comparison/summary.md
          cat comparison/summary.md
          cat comparison/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: ast-order-comparison-${{ github.run_attempt }}
          path: comparison/comparison.json
          retention-days: 14
